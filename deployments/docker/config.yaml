server:
  port: 8080

postgres:
  dsn: postgres://sudoku:sudoku@localhost:5432/sudoku_dev?sslmode=disable
  max_conns: 25
  min_conns: 5

redis:
  addr: localhost:6379
  password: ""
  db: 0
  pool_size: 10

rabbitmq:
  url: amqp://guest:guest@localhost:5672/

telemetry:
  otlp_endpoint: ""

auth:
  jwt_secret: "change-me-in-development"
  access_token_ttl: "15m"
  refresh_token_ttl: "720h"
  # Set SUDOKU_AUTH_GOOGLE_CLIENT_ID env var or replace this placeholder before running.
  google_client_id: ""

log_level: debug
